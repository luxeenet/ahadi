version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ahadi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ahadi_dev
      POSTGRES_USER: ahadi
      POSTGRES_PASSWORD: ahadi_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ahadi -d ahadi_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ahadi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ''
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ahadi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ahadi_minio_key
      MINIO_ROOT_PASSWORD: ahadi_minio_secret_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MinIO setup (create buckets on startup) ────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: ahadi_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ahadi_minio_key ahadi_minio_secret_dev &&
        mc mb --ignore-existing local/ahadi-evidence &&
        mc mb --ignore-existing local/ahadi-avatars &&
        mc mb --ignore-existing local/ahadi-documents &&
        echo 'Buckets ready'
      "

  # ── Mailhog (local email testing) ────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ahadi_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: ahadi_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ahadi:ahadi_dev_pass@postgres:5432/ahadi_dev?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    command: pnpm --filter @ahadi/api dev

  # ── Worker (BullMQ) ───────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: ahadi_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ahadi:ahadi_dev_pass@postgres:5432/ahadi_dev?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
    command: pnpm --filter @ahadi/worker dev

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: ahadi_network
